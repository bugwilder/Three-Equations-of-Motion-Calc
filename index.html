<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equations of Motion Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculator">
        <h1>Equations of Motion Calculator</h1>
        <p class="subtitle">Solve for one unknown variable</p>

        <div class="equation-selector">
            <label for="equation">Select Equation:</label>

            <select id="equation" onchange="loadEquation()">
                <option value="1">1. v = u + at</option>
                <option value="2">2. s = ut + ½at²</option>
                <option value="3">3. v² = u² + 2as</option>
            </select>
        </div>
        
        <div class="equation-display" id="equationDisplay">
            v = u + at
        </div>

        <div class="variables" id="variables">
            <!-- Variables inserted by JavaScript -->
        </div>

        <div class="result" id="result">
            Enter your values above.
        </div>

        <button class="calculate-btn" onclick="calculate()">
            Calculate
        </button>

        <button class="clear-btn" onclick="clearCalculator()">
            Clear
        </button>

        <div class="result" id="result">
            Enter your values above.
        </div>

        <div class="legend">
            <h3>Variables</h3>
            <p><strong>u</strong> = Initial Velocity</p>
            <p><strong>v</strong> = Final Velocity</p>
            <p><strong>a</strong> = Acceleration</p>
            <p><strong>t</strong> = Time</p>
            <p><strong>s</strong> = Displacement</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
